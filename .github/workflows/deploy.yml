name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/queer-making-wix-integration-agxogt
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Not secret — this is the publishable/anon key, already public in
          # the built JS bundle. Data access is governed by Supabase RLS,
          # not by keeping this value hidden.
          VITE_SUPABASE_URL: https://fqwdviljdurhdmwgcnah.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_3SwiAZjoFg3SNVHNddxing_dVr3l8rI
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
